[project]
name = "gencli-agents"
version = "0.0.1"
description = "General-purpose CLI: a library of functions exposed as commands, built for agents to use and extend"
authors = [
    {name = "gustavo.polleti", email = "gustavo.polleti@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = ["cli", "typer", "agents", "tooling"]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer (>=0.17.0,<0.18.0)",
    "rich (>=14.0.0,<15.0.0)",
    "shellingham (>=1.5.0,<2.0.0)",
]

[project.urls]
Homepage = "https://github.com/gpadpoll/general-cli"
Repository = "https://github.com/gpadpoll/general-cli"
Documentation = "https://gpadpoll.github.io/general-cli/"

[project.scripts]
gencli = "gencli.main:gencli"

[tool.poetry]
packages = [{include = "gencli"}]

[tool.poetry.group.dev.dependencies]
pre-commit = "*"
tox = "*"
flake8 = "*"
black = "*"
mypy = "*"

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.6.0"
mkdocs-markdownextradata-plugin = "^0.2.6"
# Needed to convert notebooks to markdown for inclusion in the MkDocs site
jupyter = "*"
nbconvert = "*"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.0"

[tool.poetry.group.publish.dependencies]
twine = "^6.0.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \venv
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''
