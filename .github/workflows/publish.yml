name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          PROJECT_VERSION="$(poetry version -s)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml version: $PROJECT_VERSION"
          echo "release tag version:    $TAG_VERSION"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match pyproject.toml version ($PROJECT_VERSION). Bump the version and tag again."
            exit 1
          fi

      - name: Build distributions
        run: poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/gencli/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no API token needed.
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
