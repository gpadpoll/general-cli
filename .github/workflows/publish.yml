name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Where to publish. Ignored for a Release event, which always
          publishes to pypi. Use testpypi to dry-run the whole pipeline
          against TestPyPI before a real release.
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.2"

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          PROJECT_VERSION="$(poetry version -s)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml version: $PROJECT_VERSION"
          echo "release tag version:    $TAG_VERSION"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match pyproject.toml version ($PROJECT_VERSION). Bump the version and tag again."
            exit 1
          fi

      - name: Build distributions
        run: poetry build

      - name: Check package metadata (twine)
        run: |
          pip install --quiet twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ (github.event_name == 'release' || github.event.inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
      url: ${{ (github.event_name == 'release' || github.event.inputs.target == 'pypi') && 'https://pypi.org/project/gencli-agents/' || 'https://test.pypi.org/project/gencli-agents/' }}
    permissions:
      # Required for PyPI/TestPyPI Trusted Publishing (OIDC) - no API token needed.
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name != 'release' && github.event.inputs.target != 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
